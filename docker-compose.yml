version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      TRUSTED_PROXIES: '*'
      APP_URL: ${APP_URL}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '80'
    volumes:
      - app_storage:/var/www/storage
      - app_cache:/var/www/bootstrap/cache
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10

  db:
    image: mariadb:11.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MARIADB_AUTO_UPGRADE: '1'
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--innodb-file-per-table=1'
      - '--max-connections=200'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -u$$MYSQL_USER -p$$MYSQL_PASSWORD -h 127.0.0.1 --silent']
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  app_storage:
  app_cache:
  db_data:
