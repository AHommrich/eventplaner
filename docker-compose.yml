 

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LARAVEL_ENV_FILE: .env.docker
    container_name: laravel-app
    restart: unless-stopped
    ports:
      - "8080:8080"      
    volumes:
      - .:/var/www      
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      CACHE_DRIVER: file
      SESSION_DRIVER: file
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc "php artisan serve --host=0.0.0.0 --port=8080"

  vite:
    image: node:20
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"     
    command: sh -lc "npm ci && npm run dev -- --host"

  db:
    image: mariadb:11.0
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"      
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  db_data:
