 

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LARAVEL_ENV_FILE: .env.docker
    container_name: laravel-app
    restart: unless-stopped
    ports:
      - "8080:8080"      
    volumes:
      - .:/var/www 
      - ./.env.docker:/var/www/.env:ro   
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc "php artisan serve --host=0.0.0.0 --port=8080"

  vite:
    image: node:20
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    environment:
      APP_URL: http://localhost:8080
    command: sh -lc "npm ci && npm run dev -- --host"

  db:
    image: mariadb:11.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"      
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  db_data:
