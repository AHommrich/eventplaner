name: e2e

# Playwright smoke suite — runs Chromium against an ephemeral `php artisan serve`
# instance backed by the MariaDB service. Deliberately narrow: public routes,
# health, and the login error path. See tests/e2e/*.spec.ts for the scope.

on:
  push:
    branches: [develop, staging, production]
  pull_request:
    branches: [develop, staging, production]

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: laravel_test
          MARIADB_USER: laravel
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mariadb-client

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare environment
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: secret
        run: |
          cp .env.example .env
          echo "DB_CONNECTION=mysql"       >> .env
          echo "DB_HOST=127.0.0.1"         >> .env
          echo "DB_PORT=3306"              >> .env
          echo "DB_DATABASE=laravel_test"  >> .env
          echo "DB_USERNAME=laravel"       >> .env
          echo "DB_PASSWORD=secret"        >> .env
          echo "APP_ENV=testing"           >> .env
          php artisan key:generate
          php artisan ziggy:generate

      - name: Build frontend assets
        run: npm run build

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Start Laravel server
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: secret
        run: |
          php artisan serve --host=127.0.0.1 --port=8080 &
          # Wait until /up responds. Give it up to 30s.
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/up > /dev/null 2>&1; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server never came up" >&2
          exit 1

      - name: Run Playwright
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
